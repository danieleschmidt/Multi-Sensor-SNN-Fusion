version: '3.8'

services:
  breakthrough-swarm:
    build:
      context: .
      dockerfile: Dockerfile
    image: terragon/breakthrough-neuromorphic-swarm:latest
    container_name: breakthrough-swarm-main
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
      - "9090:9090"
    environment:
      - LOG_LEVEL=INFO
      - ENABLE_QUANTUM_ACCELERATION=true
      - BATCH_PROCESSING_SIZE=32
      - PROMETHEUS_PORT=9090
    volumes:
      - ./config:/app/config:ro
      - ./cache:/app/cache
      - ./logs:/app/logs
    networks:
      - breakthrough-network
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32Gi
        reservations:
          cpus: '4'
          memory: 16Gi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    container_name: breakthrough-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - breakthrough-network

  grafana:
    image: grafana/grafana:latest
    container_name: breakthrough-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=breakthrough_admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - breakthrough-network

networks:
  breakthrough-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
